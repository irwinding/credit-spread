services:
  db:
    image: postgres:16-alpine
    container_name: credit-spread-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
      POSTGRES_DB: ${POSTGRES_DB:-credit_spread}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credit} -d ${POSTGRES_DB:-credit_spread}"]
      interval: 5s
      timeout: 5s
      retries: 10
